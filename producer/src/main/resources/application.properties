spring.application.name=liveauction-producer
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/liveauction}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=true

# Il motore recupera le transizioni scadute all'avvio e controlla gli orari ogni secondo.
app.aste.scheduler.enabled=${ASTE_SCHEDULER_ENABLED:true}
app.aste.scheduler.interval-ms=${ASTE_SCHEDULER_INTERVAL_MS:1000}

# Chiave di sviluppo: sostituire AUTH_JWT_SECRET in ogni ambiente condiviso.
app.auth.jwt-secret=${AUTH_JWT_SECRET:local-development-secret-change-before-deploying-2026}
app.auth.token-ttl=PT30M
app.auth.refresh-ttl=P7D

# Il database si avvia separatamente con `docker compose up -d postgres` dalla
# radice del repository. Questo rende l'avvio da IntelliJ indipendente dalla
# directory di lavoro scelta nella run configuration.
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false

# La coda viene registrata anche con invio disabilitato. Nessun SMTP di default.
app.notifiche.email.enabled=${EMAIL_ENABLED:false}
app.notifiche.email.from=${EMAIL_FROM:}
app.notifiche.email.retry-seconds=${EMAIL_RETRY_SECONDS:60}
app.notifiche.email.batch-size=${EMAIL_BATCH_SIZE:20}
app.notifiche.email.interval-ms=${EMAIL_INTERVAL_MS:30000}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:${SMTP_STARTTLS:true}}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
springdoc.paths-to-match=/api/v1/**
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
