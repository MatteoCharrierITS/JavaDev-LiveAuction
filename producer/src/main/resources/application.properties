spring.application.name=liveauction-producer
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/liveauction}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=true

# Il motore recupera le transizioni scadute all'avvio e controlla gli orari ogni secondo.
app.aste.scheduler.enabled=${ASTE_SCHEDULER_ENABLED:true}
app.aste.scheduler.interval-ms=${ASTE_SCHEDULER_INTERVAL_MS:1000}

# Chiave di sviluppo: sostituire AUTH_JWT_SECRET in ogni ambiente condiviso.
app.auth.jwt-secret=${AUTH_JWT_SECRET:local-development-secret-change-before-deploying-2026}
app.auth.token-ttl=PT30M
app.auth.refresh-ttl=P7D

# Il database si avvia separatamente con `docker compose up -d postgres` dalla
# radice del repository. Questo rende l'avvio da IntelliJ indipendente dalla
# directory di lavoro scelta nella run configuration.
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false
springdoc.paths-to-match=/api/v1/**
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
