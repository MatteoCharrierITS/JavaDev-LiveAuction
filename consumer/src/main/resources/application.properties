spring.application.name=liveauction-consumer
server.port=8082
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

liveauction.producer.base-url=${LIVEAUCTION_PRODUCER_URL:http://localhost:8081/api/v1}
liveauction.producer.connect-timeout=2s
liveauction.producer.read-timeout=5s

spring.thymeleaf.cache=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
