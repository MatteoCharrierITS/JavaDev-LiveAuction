<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Auctions')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main id="main-content" class="catalog-page auction-lobby" th:attr="data-server-time=${auctions.serverTime}">
    <header class="catalog-heading">
        <p class="eyebrow">THE ROOM IS YOURS</p>
        <h1>Auctions</h1>
        <p>Browse public auctions. Join the room, follow the countdown, make your move. Times are shown in Rome time.</p>
    </header>
    <p id="lobby-update-status" class="muted" role="status" aria-live="polite">Automatic updates every 5 seconds.</p>
    <noscript><p class="muted">JavaScript is disabled. Reload this page to see updated auctions.</p></noscript>
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <form class="catalog-filters" th:action="@{/aste}" method="get" aria-label="Filter auctions">
        <label for="stato">State</label>
        <select id="stato" name="stato">
            <option value="" th:selected="${stato == null}">All states</option>
            <option value="PROGRAMMATA" th:selected="${stato == 'PROGRAMMATA'}">Scheduled</option>
            <option value="STANZA_APERTA" th:selected="${stato == 'STANZA_APERTA'}">Room open</option>
            <option value="APERTA" th:selected="${stato == 'APERTA'}">Live</option>
            <option value="CHIUSA" th:selected="${stato == 'CHIUSA'}">Closed</option>
            <option value="ANNULLATA" th:selected="${stato == 'ANNULLATA'}">Cancelled</option>
        </select>
        <label for="categoria">Category slug</label>
        <input id="categoria" name="categoria" th:value="${categoria}" placeholder="e.g. informatica">
        <label for="query">Search</label>
        <input id="query" name="query" type="search" th:value="${query}" placeholder="Product name, SKU, or description">
        <input type="hidden" name="size" th:value="${auctions.size}">
        <button type="submit">Apply filters</button>
        <a th:href="@{/aste}">Clear filters</a>
    </form>
    <section id="auction-results" th:fragment="results" th:attr="data-server-time=${auctions.serverTime}" aria-label="Auction results">
        <p th:if="${auctions.content.isEmpty()}" class="empty-state">No auctions match these filters.</p>
        <th:block th:unless="${auctions.content.isEmpty()}">
            <p class="result-count" th:text="${auctions.totalElements} + ' auctions found'">Auctions found</p>
            <div class="product-grid">
                <th:block th:each="auction : ${auctions.content}">
                    <div class="auction-grid-item">
                    <div th:replace="~{fragments/auction-card :: card(${auction}, ${auctions.serverTime}, ${userVisitor}, ${signedIn})}"></div>
                    <form class="auction-cancel" th:if="${adminVisitor and auction.numeroOfferte == 0 and (auction.stato == 'PROGRAMMATA' or auction.stato == 'STANZA_APERTA' or auction.stato == 'APERTA') and auction.fineAt != null and auctions.serverTime.isBefore(auction.fineAt)}"
                          th:action="@{/admin/aste/{id}/annullamento(id=${auction.id})}" method="post">
                        <button type="submit">Cancel auction #<span th:text="${auction.id}">1</span></button>
                        <span class="muted">The Producer checks final eligibility.</span>
                    </form>
                    </div>
                </th:block>
            </div>
        </th:block>
    <nav th:if="${auctions.totalPages > 1}" class="pagination" aria-label="Auction pages">
        <a th:if="${auctions.page > 0}" th:href="@{/aste(stato=${stato},categoria=${categoria},query=${query},page=${auctions.page - 1},size=${auctions.size})}">Previous</a>
        <span th:text="'Page ' + ${auctions.page + 1} + ' of ' + ${auctions.totalPages}">Page</span>
        <a th:if="${auctions.page + 1 < auctions.totalPages}" th:href="@{/aste(stato=${stato},categoria=${categoria},query=${query},page=${auctions.page + 1},size=${auctions.size})}">Next</a>
    </nav>
    </section>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/auction-lobby.js(v='20261021-polling')}" defer></script>
</body>
</html>
