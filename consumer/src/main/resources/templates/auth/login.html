<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Sign in')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="auth-card">
    <h1>Sign in</h1>
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <form th:action="@{/login}" th:object="${form}" method="post">
        <label for="username">Username</label>
        <input id="username" th:field="*{username}" autocomplete="username" required autofocus>
        <p class="field-error" th:if="${#fields.hasErrors('username')}">Enter your username.</p>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="field-error" th:if="${#fields.hasErrors('password')}">Enter your password.</p>
        <button type="submit">Sign in</button>
    </form>
    <p>New to LiveAuction? <a th:href="@{/registrazione}">Create an account</a>.</p>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
