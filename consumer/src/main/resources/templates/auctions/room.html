<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Auction room')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main id="auction-room" class="catalog-page auction-room" th:attr="data-auction-id=${auction.id},data-room-mode=(${observer} ? 'observer' : 'bidder'),data-websocket-url=${websocketUrl},data-csrf-header=${_csrf.headerName},data-csrf-token=${_csrf.token}">
    <span id="main-content" tabindex="-1"></span>
    <header class="room-header">
        <div><a th:href="@{/aste}">← Auctions</a><h1 th:text="${auction.prodotto.nome}">Auction</h1></div>
        <p id="connection-state" class="auction-state" role="status" aria-live="polite">Synchronizing…</p>
    </header>
    <p id="observer-notice" class="alert" role="note" th:if="${observer}">You are watching as an administrator. Bidding is disabled and you are not listed among the participants.</p>
    <p id="room-alert" class="alert" role="alert" hidden></p>
    <section th:replace="~{auctions/fragments :: auctionState}"></section>
    <div class="room-grid">
        <section th:replace="~{auctions/fragments :: bidding}"></section>
        <th:block th:unless="${observer}"><section th:replace="~{auctions/fragments :: wallet}"></section></th:block>
        <section th:replace="~{auctions/fragments :: presence}"></section>
        <section th:replace="~{auctions/fragments :: feed}"></section>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script type="module" th:src="@{/js/auction-room.mjs(v='20261021-observer')}"></script>
</body>
</html>
