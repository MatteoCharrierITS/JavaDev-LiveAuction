<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<article th:fragment="card(product)" class="product-card">
    <a class="media" th:href="@{/prodotti/{id}(id=${product.id})}" tabindex="-1" aria-hidden="true">
        <span class="media-ph" th:text="${#strings.substring(product.nome, 0, 1)}">P</span>
        <img th:if="${product.immagineUrl != null and !#strings.isEmpty(product.immagineUrl)}"
             th:src="${product.immagineUrl}" alt="" loading="lazy" referrerpolicy="no-referrer"
             onerror="this.remove()">
    </a>
    <div class="card-body">
        <p class="product-category" th:text="${product.categoria.nome}">Category</p>
        <h2><a th:href="@{/prodotti/{id}(id=${product.id})}" th:text="${product.nome}">Product</a></h2>
        <p th:if="${product.descrizione != null and !#strings.isEmpty(product.descrizione)}"
           class="product-description clamp" th:text="${product.descrizione}">Description</p>
        <p class="product-price" th:if="${product.prezzoFisso != null}"><span th:text="${display.amount(product.prezzoFisso)}">0,00</span> <small>CRD</small></p>
        <p class="product-price muted" th:unless="${product.prezzoFisso != null}">No fixed price</p>
        <p class="badges">
            <span th:if="${product.astabile}" class="badge badge-auction">AVAILABLE FOR AUCTION</span>
            <span th:unless="${product.astabile}" class="badge badge-muted">NOT AUCTIONABLE</span>
            <span th:if="${product.quantitaDisponibile == 0}" class="badge badge-out stock-unavailable">Currently unavailable</span>
        </p>
        <dl class="product-facts compact">
            <div><dt>Available</dt><dd th:text="${product.quantitaDisponibile}">0</dd></div>
            <div><dt>Scheduled or live auctions</dt><dd th:text="${product.asteProgrammate}">0</dd></div>
        </dl>
        <a class="btn btn-block" th:href="@{/prodotti/{id}(id=${product.id})}">View details</a>
    </div>
</article>
</html>
