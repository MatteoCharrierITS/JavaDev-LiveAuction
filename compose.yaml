name: liveauction

services:
  postgres:
    image: postgres:16-alpine
    container_name: liveauction-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-liveauction}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-liveauction}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  producer:
    profiles: [prod]
    build:
      context: ./producer
      dockerfile: Dockerfile
    image: liveauction/producer:local
    container_name: liveauction-producer
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DOCKER_COMPOSE_ENABLED: "false"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-liveauction}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_RETRY_SECONDS: ${EMAIL_RETRY_SECONDS:-60}
      EMAIL_BATCH_SIZE: ${EMAIL_BATCH_SIZE:-20}
      EMAIL_INTERVAL_MS: ${EMAIL_INTERVAL_MS:-30000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-${SMTP_STARTTLS:-true}}
      SMTP_SSL: ${SMTP_SSL:-false}
      JAVA_TOOL_OPTIONS: ${PRODUCER_JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    ports:
      - "${PRODUCER_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8081/actuator/health]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  consumer:
    profiles: [prod]
    build:
      context: ./consumer
      dockerfile: Dockerfile
    image: liveauction/consumer:local
    container_name: liveauction-consumer
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LIVEAUCTION_PRODUCER_URL: http://producer:8081/api/v1
      JAVA_TOOL_OPTIONS: ${CONSUMER_JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    ports:
      - "${CONSUMER_PORT:-8082}:8082"
    depends_on:
      producer:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8082/actuator/health]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
    name: liveauction-postgres-data
